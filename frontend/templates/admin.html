{% extends "base.html" %}
{% block title %}Admin panel · {{ site_name }}{% endblock %}
{% block content %}
<div class="container" style="padding: 36px 0 80px;">
  <span class="eyebrow"><span class="si">පරිපාලක</span><span class="divider"></span>Admin</span>
  <h1>Admin panel</h1>

  <div class="stat-grid" id="admin-stats" style="margin-top:26px;"></div>

  <div class="tabs">
    <div class="tab active" data-panel="panel-blogs">All posts</div>
    <div class="tab" data-panel="panel-users">Users</div>
  </div>

  <div class="panel" id="panel-blogs">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Title</th><th>Author</th><th>Status</th><th>Mature</th><th>Views</th><th></th></tr></thead>
        <tbody id="admin-blogs-body"></tbody>
      </table>
    </div>
  </div>

  <div class="panel" id="panel-users" style="display:none;">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Age</th><th>Joined</th><th></th></tr></thead>
        <tbody id="admin-users-body"></tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}<script src="/static/js/admin.js"></script>{% endblock %}
